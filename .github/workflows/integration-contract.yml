name: integration-contract

on:
  pull_request:

permissions:
  contents: read

jobs:
  integration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify separated validation report contract
        run: python3 .codex/spec-verifiers/verify_pbi08.py
