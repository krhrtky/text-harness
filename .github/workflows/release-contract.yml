name: Release contract

on:
  push:
    branches:
      - codex/release-candidate
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: corepack enable
      - run: corepack prepare pnpm@11.22.0 --activate
      - name: Record native runner identity
        run: |
          echo "CANDIDATE_SHA=$GITHUB_SHA"
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
      - run: corepack pnpm install --frozen-lockfile
      - name: Verify license and NOTICE
        run: |
          pnpm verify:license
          echo "LICENSE=PASS"
          test ! -e NOTICE
          echo "NOTICE=ABSENT"
      - name: Verify security
        run: |
          pnpm verify:security
          echo "SECURITY=PASS"
      - run: pnpm verify:release
      - name: Create release attestation
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-contract.yml" --jq .id)
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson workflowId "$workflow_id" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg headSha "$GITHUB_SHA" \
            --arg runnerOs "$RUNNER_OS" \
            --arg runnerArch "$RUNNER_ARCH" \
            '{schemaVersion: 1, repository: $repository, workflowId: $workflowId, runId: $runId, runAttempt: $runAttempt, event: $event, branch: $branch, headSha: $headSha, runnerOs: $runnerOs, runnerArch: $runnerArch, freshCheckout: true, installCommand: "corepack pnpm install --frozen-lockfile", releaseCommand: "pnpm verify:release", license: "PASS", notice: "ABSENT", security: "PASS"}' \
            > release-attestation.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: release-attestation
          path: release-attestation.json
          if-no-files-found: error
